    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <title>Lumière v1 (archived)</title>
    <!-- Archived build of commit 131ca6a (Sep 2026), linked from the live site's time machine -->
    <meta name="robots" content="noindex" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/archived/time-machine.css" />
    <script>
      // Arriving from the time machine: mark the page before first paint so it opens covered
      // (the live site set this flag as it left; see time-machine.js)
      try {
        if (
          sessionStorage.getItem('lumiere-time-travel') === '/archived/v1/' &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          document.documentElement.classList.add('tm-arriving')
          // Failsafe: if time-machine.js never runs, don't leave the page covered
          setTimeout(function () {
            if (!document.querySelector('.tm-overlay')) document.documentElement.classList.remove('tm-arriving')
          }, 4000)
        }
        sessionStorage.removeItem('lumiere-time-travel')
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" crossorigin href="/archived/v1/assets/index-DSUa9Vj_.css">
